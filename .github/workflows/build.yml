name: build

on:
  push:
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "/*.md"
  schedule:
    - cron: "0 2 * * *" # run at 2 A.M.

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Modify apt sources
        if: runner.os == 'Linux'
        run: sudo sed -i 's/azure\.//' /etc/apt/sources.list && sudo apt-get update

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -o Acquire::Retries=3 xorg-dev libglfw3-dev libglu1-mesa-dev libxkbcommon-dev

      - name: Create build directory
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: |
          set -o pipefail
          cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DPMP_BUILD_EXAMPLES=ON -DPMP_BUILD_TESTS=ON -DPMP_BUILD_REGRESSIONS=ON 2>&1 | tee configure.log || {
            grep -nE -A3 'CMake Error|error' configure.log | head -12 | sed 's/^/::error::/'
            tail -n 6 configure.log | sed 's/^/::error::TAIL /'
            exit 1
          }

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        # surface the first error lines as annotations (visible without a token)
        run: |
          set -o pipefail
          cmake --build . --config $BUILD_TYPE --parallel --verbose 2>&1 | tee build.log || {
            grep -n -m1 -B6 'error:' build.log | cut -c1-300 | sed 's/^/::error::/'
            grep -n 'glfw3webgpu_objc' build.log | head -2 | cut -c1-400 | sed 's/^/::error::CMD /'
            exit 1
          }

      - name: Test
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -C $BUILD_TYPE
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
